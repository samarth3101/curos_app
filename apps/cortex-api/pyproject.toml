[project]
name = "cortex-api"
version = "0.1.0"
description = "Curos Cortex OI — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Cache
    "redis[hiredis]>=5.2.0",
    # Auth / Security
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.12",
    # Logging
    "structlog>=24.4.0",
    # HTTP client (for integrations)
    "httpx>=0.27.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",  # for TestClient
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.4",
]

# ==============================================================
# Ruff — Linter + Formatter
# ==============================================================
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (type hints required)
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "B008",     # Depends() in FastAPI
    "A002",     # shadowing python builtin (like type)
    "UP042",    # StrEnum
    "ANN",      # Missing type annotations
    "B904",     # raise from
    "S101",     # assert allowed in tests
    "S104",     # binding to 0.0.0.0 is intentional in server config
    "S105",     # false positive: token_type = "bearer" is not a password
    "PLW0603",  # global statement — intentional singleton pattern for DB/Redis clients
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "ANN", "S106", "E402"]  # S106: password_hash="hashed" is a test stub
"alembic/*" = ["ANN", "N999"]
"conftest.py" = ["F403", "F401"]  # wildcard imports used for SQLAlchemy model registration side-effects

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================
# MyPy — Static Type Checker
# ==============================================================
[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Relax strict settings for specific areas
[[tool.mypy.overrides]]
module = [
    "alembic.*", 
    "app.modules.*.tests.*", 
    "app.modules.*.api.*",
    "app.modules.*.infrastructure.repositories",
    "app.modules.*.infrastructure.models",
    "app.shared.base_repository",
    "app.modules.identity.application.services",
    "app.modules.authorization.application.services",
    "app.core.config",
    "app.infrastructure.cache",
    "app.core.dependencies"
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["jose.*", "argon2.*"]
ignore_missing_imports = true

# ==============================================================
# Pytest
# ==============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["app"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-v",
    "--tb=short",
]
markers = [
    "unit: pure unit tests (no I/O)",
    "integration: requires running services",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*", "app/main.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
